<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SYTION — Trợ lý AI giáo xứ Hòa An</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;700&family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#040912;--panel:rgba(9,20,36,.72);--line:#17304c;--cy:#35e0ff;--gold:#f2c14e;--red:#ff5c6c;--tx:#dce7f3;--mu:#6f86a0;--hud:'Orbitron','Be Vietnam Pro',sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(1100px 650px at 50% -8%,#0c2440 0,var(--bg) 62%);color:var(--tx);font:400 15px/1.6 'Be Vietnam Pro',system-ui,sans-serif;overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.scan{position:fixed;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(53,224,255,.035) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
.scan::after{content:"";position:absolute;left:0;right:0;height:120px;top:-120px;background:linear-gradient(transparent,rgba(53,224,255,.07),transparent);animation:sweep 7s linear infinite}
@keyframes sweep{to{transform:translateY(calc(100vh + 240px))}}
.app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;max-width:860px;margin:0 auto;padding:0 16px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0 8px;gap:10px}
.brand{font:800 20px var(--hud);letter-spacing:.38em;color:var(--cy);text-shadow:0 0 14px rgba(53,224,255,.6);position:relative}
.brand.glitch{animation:gl .5s steps(2) 2}
@keyframes gl{0%{transform:translate(2px,0);text-shadow:-3px 0 var(--red),3px 0 var(--gold)}50%{transform:translate(-2px,1px)}100%{transform:none}}
.sub{font-size:11px;color:var(--mu);letter-spacing:.03em}
.tel{font:500 11px var(--hud);color:var(--mu);text-align:right;line-height:1.5}
.tel b{color:var(--cy);font-weight:500}
.led{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3dff9a;box-shadow:0 0 8px #3dff9a;margin-right:6px;animation:bl 2s infinite}
.led.bad{background:var(--red);box-shadow:0 0 8px var(--red)}
@keyframes bl{50%{opacity:.35}}
.tools{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:4px}
.tg{background:rgba(9,20,36,.6);border:1px solid var(--line);color:var(--mu);padding:5px 12px;border-radius:99px;font:inherit;font-size:12px;cursor:pointer;transition:.2s}
.tg[aria-pressed=true]{color:var(--gold);border-color:var(--gold);box-shadow:0 0 12px rgba(242,193,78,.25)}
.stage{display:flex;flex-direction:column;align-items:center;flex:0 0 auto}
#orb{width:220px;height:220px;cursor:pointer}
#status{font:500 12px var(--hud);letter-spacing:.14em;color:var(--cy);min-height:20px;text-align:center}
main{flex:1;min-height:0;overflow-y:auto;padding:14px 16px;margin-top:6px;background:var(--panel);backdrop-filter:blur(6px);border:1px solid var(--line);position:relative;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.corner{position:absolute;width:14px;height:14px;border:2px solid var(--cy);pointer-events:none;z-index:3;filter:drop-shadow(0 0 4px var(--cy))}
.tl{top:-1px;left:-1px;border-right:0;border-bottom:0}.tr{top:-1px;right:-1px;border-left:0;border-bottom:0}
.bl{bottom:-1px;left:-1px;border-right:0;border-top:0}.br{bottom:-1px;right:-1px;border-left:0;border-top:0}
.panelwrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.m{max-width:86%;margin:10px 0;padding:10px 14px;white-space:pre-wrap;word-wrap:break-word;animation:in .35s cubic-bezier(.2,.9,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(8px) scale(.98)}}
.m.u{margin-left:auto;background:#10314f;border:1px solid #1f5079;border-radius:14px 14px 3px 14px}
.m.a{background:rgba(6,16,30,.85);border:1px solid var(--line);border-left:2px solid var(--cy);border-radius:3px 14px 14px 14px;box-shadow:0 0 18px rgba(53,224,255,.07)}
.m.a.typing::after{content:"▍";color:var(--cy);animation:bl .8s infinite}
.m.err{border-left-color:var(--red);color:#ffb0b9}
.m em{color:var(--gold);font-style:italic;opacity:.9}
.dots span{display:inline-block;width:6px;height:6px;margin:0 3px;border-radius:50%;background:var(--cy);animation:dot 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1.2);opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px 0 0}
.chips button{background:rgba(9,20,36,.7);border:1px solid var(--line);color:var(--tx);padding:7px 14px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer;transition:.2s}
.chips button:hover{border-color:var(--cy);box-shadow:0 0 14px rgba(53,224,255,.3);transform:translateY(-1px)}
form{display:flex;gap:8px;padding:10px 0 calc(14px + env(safe-area-inset-bottom,0px))}
input{flex:1;min-width:0;background:rgba(9,20,36,.85);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px 14px;font:inherit;transition:.2s}
input:focus{outline:none;border-color:var(--cy);box-shadow:0 0 16px rgba(53,224,255,.25)}
button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.b{position:relative;overflow:hidden;background:var(--cy);color:#04121c;border:0;border-radius:12px;padding:0 20px;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer}
.b.mic{background:rgba(9,20,36,.85);color:var(--cy);border:1px solid var(--line);width:48px;padding:0;font-size:18px}
.b.mic.on{background:var(--gold);color:#241a00;animation:ring 1.2s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(242,193,78,.6)}100%{box-shadow:0 0 0 16px transparent}}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rp .6s linear}
@keyframes rp{to{transform:scale(4);opacity:0}}
#boot{position:fixed;inset:0;z-index:20;background:radial-gradient(800px 500px at 50% 40%,#0a2038,#02060c);display:flex;align-items:center;justify-content:center;transition:opacity .9s,visibility .9s}
#boot.off{opacity:0;visibility:hidden}
.bootbox{width:min(520px,90vw);font:500 12px/1.9 var(--hud);color:var(--cy)}
#bootlog{min-height:190px;white-space:pre-wrap;color:#7fdcf0}
#go{margin-top:14px;width:100%;padding:14px;background:transparent;border:1px solid var(--cy);color:var(--cy);font:800 14px var(--hud);letter-spacing:.3em;border-radius:6px;cursor:pointer;box-shadow:0 0 22px rgba(53,224,255,.3),inset 0 0 22px rgba(53,224,255,.1);animation:bl 1.6s infinite}
#go:hover{background:rgba(53,224,255,.12)}
#go[disabled]{animation:none;opacity:.5;cursor:default}
@media(max-width:560px){#orb{width:150px;height:150px}.m{max-width:94%}.tel{display:none}.brand{font-size:17px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}.scan::after{display:none}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="scan" aria-hidden="true"></div>

<div id="boot"><div class="bootbox"><pre id="bootlog"></pre><button id="go">KÍCH HOẠT SYTION</button></div></div>

<div class="app">
  <header>
    <div><div class="brand" id="brand">SYTION</div><div class="sub">Trợ lý giáo xứ Hòa An · Giáo phận Bắc Ninh</div></div>
    <div class="tel"><span class="led" id="led"></span><b id="clock">--:--:--</b><br>PHẢN HỒI <b id="lat">--</b> · <b id="mdl">GEMINI</b></div>
  </header>
  <div class="tools">
    <button class="tg" id="tgVoice" aria-pressed="true">Giọng nói</button>
    <button class="tg" id="tgSound" aria-pressed="true">Âm thanh</button>
    <button class="tg" id="tgJarvis" aria-pressed="false">Chế độ Jarvis</button>
    <button class="tg" id="clear" aria-pressed="false">Xóa hội thoại</button>
  </div>
  <section class="stage"><canvas id="orb" width="440" height="440" aria-hidden="true"></canvas><div id="status" aria-live="polite">CHỜ LỆNH</div></section>
  <div class="panelwrap">
    <main id="log" aria-live="polite"></main>
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
  </div>
  <div class="chips" id="chips">
    <button>Cha xứ Hòa An là ai?</button><button>Hôm nay là ngày gì?</button><button>Giải thích Kinh Lạy Cha cho tôi</button><button>Kể tôi nghe một chuyện cười</button>
  </div>
  <form id="f"><input id="q" placeholder="Nhắn cho Sytion..." autocomplete="off" aria-label="Tin nhắn"><button type="button" class="b mic" id="mic" aria-label="Nói với Sytion">🎤</button><button class="b" id="sendBtn">Gửi</button></form>
</div>

<script>
const $=id=>document.getElementById(id), log=$('log'), q=$('q'), st=$('status'), calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
let hist=[], state='idle', voiceOn=true, soundOn=true, jarvis=false, busy=false, speaking=false, listening=false, ttsCool=0, rec=null, speakTok=0;

/* ================= ÂM THANH (WebAudio, tự tổng hợp) ================= */
let ac, master, an, anBuf, hum;
function initAudio(){
  if(ac) return;
  ac=new (window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain(); master.gain.value=.55;
  an=ac.createAnalyser(); an.fftSize=128; anBuf=new Uint8Array(an.frequencyBinCount);
  master.connect(ac.destination); an.connect(master);
  // tiếng ù nền rất nhỏ
  const g=ac.createGain(); g.gain.value=.025; const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=220;
  [55,55.6,110].forEach(fr=>{const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.value=fr; o.connect(f); o.start()});
  f.connect(g); g.connect(master); hum=g;
}
function tone(f1,f2,dur,type='sine',vol=.15,delay=0){
  if(!ac||!soundOn) return; const t=ac.currentTime+delay, o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.05);
}
const sfx={
  boot(){tone(60,900,1.4,'sawtooth',.08); [523,659,784,1046,1568].forEach((f,i)=>tone(f,f*1.01,.35,'triangle',.11,.9+i*.13))},
  send(){tone(500,1100,.14,'sine',.14); tone(1100,1700,.1,'triangle',.06,.05)},
  recv(){tone(880,880,.25,'sine',.12); tone(1320,1320,.4,'sine',.1,.12)},
  on(){tone(600,1200,.16,'square',.05)}, off(){tone(1100,500,.16,'square',.05)},
  key(){tone(1500+Math.random()*900,1200,.03,'square',.018)},
  err(){tone(220,90,.4,'sawtooth',.1)}, click(){tone(900,600,.06,'triangle',.08)}
};

/* ================= NỀN HẠT (particle network) ================= */
const bg=$('bg'), bx=bg.getContext('2d'); let W,H,P=[],mouse={x:-999,y:-999};
function rs(){const d=Math.min(devicePixelRatio||1,2); W=bg.width=innerWidth*d; H=bg.height=innerHeight*d; bx.setTransform(d,0,0,d,0,0);
  P=Array.from({length:innerWidth<600?32:70},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35}))}
addEventListener('resize',rs); rs();
addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
function net(){
  bx.clearRect(0,0,innerWidth,innerHeight);
  for(const p of P){
    if(!calm){p.x+=p.vx;p.y+=p.vy}
    if(p.x<0||p.x>innerWidth)p.vx*=-1; if(p.y<0||p.y>innerHeight)p.vy*=-1;
    const dx=p.x-mouse.x, dy=p.y-mouse.y, dm=Math.hypot(dx,dy); if(dm<140&&!calm){p.x+=dx/dm*.9;p.y+=dy/dm*.9}
    bx.fillStyle='rgba(53,224,255,.6)'; bx.beginPath(); bx.arc(p.x,p.y,1.4,0,6.283); bx.fill();
  }
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
    const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);
    if(d<125){bx.strokeStyle=`rgba(53,224,255,${.16*(1-d/125)})`; bx.beginPath(); bx.moveTo(P[i].x,P[i].y); bx.lineTo(P[j].x,P[j].y); bx.stroke()}
  }
  requestAnimationFrame(net);
}
net();

/* ================= QUẢ CẦU HUD ================= */
const cv=$('orb'), cx=cv.getContext('2d'); let t=0, lvl=0;
const COL={idle:'#35e0ff',listen:'#f2c14e',think:'#a78bfa',speak:'#7ff0ff'};
function orb(){
  const c=COL[state]; t+=calm?0:({idle:.006,listen:.012,think:.05,speak:.018})[state];
  let amp=0;
  if(state==='speak'&&an){an.getByteFrequencyData(anBuf); amp=anBuf.reduce((a,b)=>a+b,0)/anBuf.length/255*2.2}
  else if(state==='listen') amp=.25+.2*Math.sin(t*20);
  lvl+=(Math.min(amp,1)-lvl)*.25;
  cx.setTransform(1,0,0,1,0,0); cx.clearRect(0,0,440,440); cx.translate(220,220);
  const pulse=1+lvl*.12+Math.sin(t*6)*.012;
  // vầng sáng
  const g=cx.createRadialGradient(0,0,10,0,0,150); g.addColorStop(0,c+'55'); g.addColorStop(1,'transparent');
  cx.fillStyle=g; cx.beginPath(); cx.arc(0,0,150*pulse,0,6.283); cx.fill();
  // thanh phổ quanh cầu
  const N=72; cx.strokeStyle=c; cx.lineWidth=3; cx.lineCap='round';
  for(let i=0;i<N;i++){
    const a=i/N*6.283, v=state==='speak'&&anBuf?anBuf[i%anBuf.length]/255:(state==='listen'?.3+.3*Math.sin(t*14+i):.04+.03*Math.sin(t*3+i));
    const r1=118*pulse, r2=r1+4+v*(state==='think'?4:34);
    cx.globalAlpha=.35+v*.65; cx.beginPath(); cx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1); cx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2); cx.stroke();
  }
  cx.globalAlpha=1; cx.lineWidth=2;
  // vòng xoay
  [[100,[90,26]],[86,[14,10]],[72,[160,40]],[58,[6,8]]].forEach(([r,d],i)=>{
    cx.save(); cx.rotate(t*(i%2?-1:1)*(1+i*.45)); cx.setLineDash(d); cx.strokeStyle=c; cx.globalAlpha=.9-i*.15;
    cx.beginPath(); cx.arc(0,0,r*pulse,0,6.283); cx.stroke(); cx.restore();
  });
  if(state==='think'){cx.save(); cx.rotate(t*3); cx.strokeStyle=c; cx.lineWidth=5; cx.globalAlpha=.9; cx.beginPath(); cx.arc(0,0,132,0,1.1); cx.stroke(); cx.restore()}
  // lõi
  const k=cx.createRadialGradient(0,0,0,0,0,(38+lvl*22)); k.addColorStop(0,'#fff'); k.addColorStop(.35,c); k.addColorStop(1,'transparent');
  cx.globalAlpha=.95; cx.fillStyle=k; cx.beginPath(); cx.arc(0,0,38+lvl*22,0,6.283); cx.fill(); cx.globalAlpha=1;
  requestAnimationFrame(orb);
}
orb();
const LABEL={idle:'CHỜ LỆNH',listen:'ĐANG NGHE',think:'ĐANG XỬ LÝ',speak:'ĐANG PHÁT NGÔN'};
function set(s,txt){state=s; st.textContent=(txt||LABEL[s]).toUpperCase()}
$('orb').onclick=()=>{initAudio(); sfx.click(); listen(true)};

/* ================= HIỆU ỨNG PHỤ ================= */
setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('vi-VN',{hour12:false})},1000);
document.addEventListener('click',e=>{const b=e.target.closest('.b'); if(!b) return; const r=b.getBoundingClientRect(), s=Math.max(r.width,r.height), i=document.createElement('i');
  i.className='rip'; i.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`; b.appendChild(i); setTimeout(()=>i.remove(),600)});
q.addEventListener('input',()=>sfx.key());

/* ================= CHAT ================= */
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<em>$1</em>');
function add(text,cls){const d=document.createElement('div'); d.className='m '+cls; d.textContent=text; log.appendChild(d); log.scrollTop=log.scrollHeight; return d}
function typeInto(el,text){
  return new Promise(res=>{
    if(calm){el.innerHTML=fmt(text); return res()}
    el.classList.add('typing'); let i=0; const step=Math.max(1,Math.ceil(text.length/260));
    const id=setInterval(()=>{ i+=step; el.textContent=text.slice(0,i); if((i/step)%2===0) sfx.key(); log.scrollTop=log.scrollHeight;
      if(i>=text.length){clearInterval(id); el.classList.remove('typing'); el.innerHTML=fmt(text); res()} },16);
  });
}
async function send(text){
  text=(text||'').trim(); if(!text||busy) return;
  initAudio(); busy=true; stopSpeak(); stopRec(); $('chips')?.remove();
  add(text,'u'); hist.push({role:'user',content:text}); hist=hist.slice(-20); q.value=''; sfx.send();
  set('think'); const wait=add('','a'); wait.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';
  const t0=performance.now();
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist})});
    const d=await r.json().catch(()=>({error:'Máy chủ trả về dữ liệu không đọc được. Kiểm tra lại deploy trên Vercel.'}));
    if(!r.ok) throw new Error(d.error||('Lỗi '+r.status));
    $('lat').textContent=((performance.now()-t0)/1000).toFixed(1)+'s'; $('mdl').textContent=(d.model||'GEMINI').replace('gemini-','').toUpperCase();
    $('led').classList.remove('bad'); hist.push({role:'assistant',content:d.reply}); sfx.recv();
    wait.textContent=''; set('idle','ĐANG TRẢ LỜI');
    await Promise.all([typeInto(wait,d.reply), speak(d.reply)]);
    set('idle');
  }catch(e){
    wait.className='m a err'; wait.textContent='⚠ '+e.message; hist.pop(); sfx.err(); $('led').classList.add('bad'); set('idle','LỖI KẾT NỐI');
  }finally{
    busy=false; if(jarvis) setTimeout(()=>listen(false),400);
  }
}
$('f').onsubmit=e=>{e.preventDefault(); send(q.value)};
$('chips').onclick=e=>{if(e.target.tagName==='BUTTON'){initAudio(); send(e.target.textContent)}};
$('clear').onclick=()=>{hist=[]; log.innerHTML=''; stopSpeak(); sfx.click()};

/* ================= GIỌNG NÓI RA ================= */
const speechText=s=>{s=s.replace(/\*\*(.+?)\*\*/g,'$1').replace(/\*[^*]+\*/g,'').replace(/\s+/g,' ').trim(); if(s.length>380){const c=s.slice(0,380); const k=Math.max(c.lastIndexOf('. '),c.lastIndexOf('? '),c.lastIndexOf('! ')); s=c.slice(0,k>120?k+1:380)} return s};
function stopSpeak(){speakTok++; speaking=false; try{speechSynthesis.cancel()}catch{} if(curSrc){try{curSrc.stop()}catch{} curSrc=null}}
let curSrc=null;
async function speak(text){
  const tok=++speakTok; const clean=speechText(text);
  if(!voiceOn||!clean) return;
  speaking=true;
  try{
    if(Date.now()<ttsCool) throw new Error('cool');
    const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:clean})});
    const d=await r.json(); if(!r.ok||!d.audio) throw new Error(d.error||'tts');
    if(tok!==speakTok) return;
    await playPCM(d.audio,d.rate||24000,tok);
  }catch(e){
    if(e.message!=='cool') ttsCool=Date.now()+45000; // Gemini TTS hết hạn mức → dùng giọng trình duyệt trong 45s
    if(tok===speakTok) await browserSpeak(clean,tok);
  }
  if(tok===speakTok){speaking=false; set('idle')}
}
function playPCM(b64,rate,tok){
  return new Promise(res=>{
    const bin=atob(b64), n=bin.length>>1, buf=ac.createBuffer(1,n,rate), ch=buf.getChannelData(0);
    for(let i=0;i<n;i++){let v=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8); if(v>=32768)v-=65536; ch[i]=v/32768}
    const s=ac.createBufferSource(); s.buffer=buf; s.connect(an); curSrc=s; s.onended=()=>{curSrc=null;res()};
    if(ac.state==='suspended') ac.resume(); set('speak'); s.start();
  });
}
function browserSpeak(text,tok){
  return new Promise(res=>{
    if(!('speechSynthesis' in window)) return res();
    const u=new SpeechSynthesisUtterance(text); u.lang='vi-VN'; u.rate=.92; u.pitch=.7;
    const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('vi')); if(v) u.voice=v;
    u.onstart=()=>set('speak'); u.onend=u.onerror=()=>res(); speechSynthesis.speak(u);
  });
}

/* ================= GIỌNG NÓI VÀO ================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function stopRec(){if(rec){rec.onend=null; try{rec.abort()}catch{} rec=null} listening=false; $('mic').classList.remove('on')}
function listen(loud){
  initAudio();
  if(!SR){add('Trình duyệt này không hỗ trợ nhận giọng nói. Hãy dùng Chrome hoặc Edge.','a err'); return}
  if(busy||speaking||listening) return;
  const r=new SR(); rec=r; r.lang='vi-VN'; r.interimResults=true; let final='';
  r.onstart=()=>{listening=true; set('listen'); $('mic').classList.add('on'); if(loud!==false) sfx.on()};
  r.onresult=e=>{let s=''; for(const x of e.results) s+=x[0].transcript; q.value=s; if(e.results[e.results.length-1].isFinal) final=s};
  r.onerror=e=>{ if(e.error==='not-allowed'||e.error==='service-not-allowed'){ jarvis=false; $('tgJarvis').setAttribute('aria-pressed',false); add('Chưa có quyền dùng micro. Bấm biểu tượng ổ khóa cạnh thanh địa chỉ → cho phép Micro.','a err') } };
  r.onend=()=>{ if(rec!==r) return; listening=false; rec=null; $('mic').classList.remove('on'); sfx.off();
    if(final) send(final); else { set('idle'); if(jarvis) setTimeout(()=>listen(false),500) } };
  try{r.start()}catch{}
}
$('mic').onclick=()=>{initAudio(); if(listening){stopRec(); set('idle'); return} stopSpeak(); listen(true)};

/* ================= CÔNG TẮC ================= */
$('tgVoice').onclick=e=>{voiceOn=!voiceOn; e.target.setAttribute('aria-pressed',voiceOn); if(!voiceOn) stopSpeak(); sfx.click()};
$('tgSound').onclick=e=>{soundOn=!soundOn; e.target.setAttribute('aria-pressed',soundOn); if(master) master.gain.value=soundOn?.55:0; if(soundOn) sfx.click()};
$('tgJarvis').onclick=e=>{jarvis=!jarvis; e.target.setAttribute('aria-pressed',jarvis); initAudio();
  if(jarvis){voiceOn=true; $('tgVoice').setAttribute('aria-pressed',true); sfx.on(); listen(false)} else {stopRec(); set('idle')}};

/* ================= KHỞI ĐỘNG ================= */
const BOOT=['> SYTION CORE v2.0','> nạp mô-đun ngôn ngữ tiếng Việt ........ OK','> kết nối lõi Gemini ................... OK','> tải hồ sơ giáo xứ Hòa An ............. OK','> hiệu chỉnh mức độ chán nản ........... 87%','> tất cả hệ thống sẵn sàng. haizz...'];
$('go').onclick=async()=>{
  const b=$('go'); b.disabled=true; b.textContent='ĐANG KHỞI ĐỘNG...'; initAudio(); if(ac.state==='suspended') await ac.resume(); sfx.boot();
  const pre=$('bootlog');
  for(const line of BOOT){ for(const ch of line){pre.textContent+=ch; await new Promise(r=>setTimeout(r,calm?0:12))} pre.textContent+='\n'; sfx.key(); await new Promise(r=>setTimeout(r,calm?0:150)) }
  await new Promise(r=>setTimeout(r,500));
  $('boot').classList.add('off'); $('brand').classList.add('glitch');
  const hi='*thở dài* Sytion đã thức dậy. Lại một ngày nữa. Hỏi đi, tôi biết hết về Cha xứ Hòa An mà.';
  const el=add('','a'); set('idle','ĐANG TRẢ LỜI'); await Promise.all([typeInto(el,hi),speak(hi)]); set('idle');
};
if('speechSynthesis' in window) speechSynthesis.getVoices();
</script>
