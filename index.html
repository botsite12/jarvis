<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.A.R.V.I.S | made by CUONG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link data-default-icon="https://static.xx.fbcdn.net/rsrc.php/y1/r/ay1hV6OlegS.ico" data-badged-icon="https://static.xx.fbcdn.net/rsrc.php/yD/r/UJj0tgk-RrT.ico" rel="shortcut icon" href="https://static.xx.fbcdn.net/rsrc.php/y1/r/ay1hV6OlegS.ico">
<style>
  :root{
    --bg:#EAF0F8; --bg2:#FFFFFF; --panel:#FFFFFF; --line:#D3DCEA;
    --text:#141A26; --muted:#5B6B85;
    --cyan:#0A8FA6; --cyan2:#12B5C9; --cyan-glow:rgba(10,143,166,.28);
    --gold:#B87E1F; --danger:#C4432B;
    --bubble-user:#0A8FA6; --bubble-user2:#0FB8A8; --bubble-user-text:#FFFFFF;
    --glass:rgba(255,255,255,.66); --glass-2:rgba(255,255,255,.5);
    --grid-line:rgba(10,143,166,.08);
    --font-h:'Orbitron',ui-sans-serif,system-ui,sans-serif;
    --font-b:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#060A13; --bg2:#0E1420; --panel:#101827; --line:#22314A;
      --text:#E7ECF5; --muted:#7C8CA8;
      --cyan:#4FD8EB; --cyan2:#38C6DD; --cyan-glow:rgba(79,216,235,.25);
      --gold:#E8A33D; --danger:#FF6B57;
      --bubble-user:#173044; --bubble-user2:#1C4258; --bubble-user-text:#EAF7FA;
      --glass:rgba(16,24,39,.6); --glass-2:rgba(16,24,39,.45);
      --grid-line:rgba(79,216,235,.06);
    }
  }
  :root[data-theme="dark"]{
    --bg:#060A13; --bg2:#0E1420; --panel:#101827; --line:#22314A;
    --text:#E7ECF5; --muted:#7C8CA8;
    --cyan:#4FD8EB; --cyan2:#38C6DD; --cyan-glow:rgba(79,216,235,.25);
    --gold:#E8A33D; --danger:#FF6B57;
    --bubble-user:#173044; --bubble-user2:#1C4258; --bubble-user-text:#EAF7FA;
    --glass:rgba(16,24,39,.6); --glass-2:rgba(16,24,39,.45);
    --grid-line:rgba(79,216,235,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-b);overflow:hidden}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  button{font-family:inherit}
  ::selection{background:var(--cyan-glow)}

  /* ============ NỀN ĐỘNG ============ */
  #bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .aurora{position:absolute;border-radius:50%;filter:blur(85px);opacity:.4;will-change:transform}
  .a1{width:55vmax;height:55vmax;top:-22vmax;left:-14vmax;
    background:radial-gradient(circle,var(--cyan) 0%,transparent 62%);
    animation:drift1 26s ease-in-out infinite alternate}
  .a2{width:48vmax;height:48vmax;bottom:-20vmax;right:-12vmax;
    background:radial-gradient(circle,var(--cyan2) 0%,transparent 62%);
    animation:drift2 31s ease-in-out infinite alternate}
  .a3{width:30vmax;height:30vmax;top:38%;left:56%;
    background:radial-gradient(circle,var(--gold) 0%,transparent 60%);
    opacity:.14;animation:drift3 23s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:translate(9vmax,7vmax) scale(1.15)}}
  @keyframes drift2{to{transform:translate(-8vmax,-6vmax) scale(1.12)}}
  @keyframes drift3{to{transform:translate(-6vmax,5vmax) scale(.85)}}
  .grid-overlay{position:absolute;inset:0;
    background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 25%,transparent 78%);
    mask-image:radial-gradient(ellipse at 50% 40%,#000 25%,transparent 78%)}
  #stars{position:absolute;inset:0;width:100%;height:100%}

  /* ============ LOCK / ĐĂNG NHẬP ============ */
  #lock{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    z-index:50; padding:24px; padding-top:calc(24px + env(safe-area-inset-top,0px));
    overflow-y:auto;
  }
  .lock-card{
    position:relative; width:100%; max-width:390px; text-align:center;
    background:var(--glass); backdrop-filter:blur(22px) saturate(1.5); -webkit-backdrop-filter:blur(22px) saturate(1.5);
    border:1px solid var(--line); border-radius:22px;
    padding:32px 30px 26px; overflow:hidden;
    box-shadow:0 24px 70px rgba(0,0,0,.35), 0 0 0 1px var(--cyan-glow), inset 0 1px 0 var(--glass-2);
    animation:cardIn .6s cubic-bezier(.21,1.02,.73,1) both;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
  .lock-card::before,.lock-card::after,
  .lock-brackets i::before,.lock-brackets i::after{
    content:'';position:absolute;width:24px;height:24px;border:2px solid var(--cyan);
    filter:drop-shadow(0 0 6px var(--cyan-glow))}
  .lock-card::before{top:10px;left:10px;border-right:none;border-bottom:none;border-radius:6px 0 0 0}
  .lock-card::after{top:10px;right:10px;border-left:none;border-bottom:none;border-radius:0 6px 0 0}
  .lock-brackets i::before{bottom:10px;left:10px;border-right:none;border-top:none;border-radius:0 0 0 6px}
  .lock-brackets i::after{bottom:10px;right:10px;border-left:none;border-top:none;border-radius:0 0 6px 0}
  .scanline{position:absolute;left:0;right:0;height:90px;top:-90px;pointer-events:none;
    background:linear-gradient(180deg,transparent,var(--cyan-glow),transparent);
    animation:scan 4.5s ease-in-out infinite}
  @keyframes scan{0%{top:-90px}55%,100%{top:calc(100% + 10px)}}

  .orb-wrap{position:relative;width:78px;height:78px;margin:0 auto 14px}
  .orb{
    position:absolute;inset:10px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%,var(--cyan),var(--cyan2) 45%,transparent 75%),var(--bg2);
    border:1px solid var(--cyan);
    box-shadow:0 0 26px var(--cyan-glow), inset 0 0 18px var(--cyan-glow);
    animation:corePulse 2.6s ease-in-out infinite;
  }
  @keyframes corePulse{0%,100%{box-shadow:0 0 16px var(--cyan-glow),inset 0 0 14px var(--cyan-glow)}
    50%{box-shadow:0 0 42px var(--cyan-glow),inset 0 0 26px var(--cyan-glow)}}
  .ring{position:absolute;inset:0;border-radius:50%;border:1.6px solid transparent}
  .ring.r1{border-top-color:var(--cyan);border-right-color:var(--cyan);animation:spin 3s linear infinite}
  .ring.r2{inset:-7px;border-bottom-color:var(--gold);animation:spinR 7s linear infinite;opacity:.6}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinR{to{transform:rotate(-360deg)}}

  .lock-title{
    font-family:var(--font-h);font-weight:800;letter-spacing:.18em;font-size:22px;margin:0 0 4px;
    background:linear-gradient(90deg,var(--text) 15%,var(--cyan) 50%,var(--text) 85%);
    background-size:200% auto;-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    animation:shimmer 5s linear infinite}
  @keyframes shimmer{to{background-position:200% center}}
  .lock-sub{color:var(--muted);font-size:12.5px;margin:0 0 18px;line-height:1.55}

  /* Tabs Đăng nhập / Đăng ký */
  .tabs{display:flex;gap:5px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:18px}
  .tab{flex:1;padding:9px 0;border:none;border-radius:999px;background:transparent;color:var(--muted);
    font-weight:600;font-size:13px;cursor:pointer;transition:background .2s, color .2s, box-shadow .2s}
  .tab.active{background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:#fff;box-shadow:0 4px 14px var(--cyan-glow)}
  .auth-form input{
    width:100%;padding:12px 17px;background:var(--bg2);border:1px solid var(--line);color:var(--text);
    font-family:var(--font-b);font-size:14.5px;outline:none;margin-bottom:10px;
    border-radius:999px;transition:border-color .2s, box-shadow .2s}
  .auth-form input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-glow)}
  .auth-form button{
    width:100%;padding:12px;border:none;color:#fff;margin-top:2px;
    background:linear-gradient(135deg,var(--cyan),var(--cyan2));
    font-weight:600;letter-spacing:.06em;cursor:pointer;font-size:14px;border-radius:999px;
    box-shadow:0 6px 20px var(--cyan-glow);transition:transform .12s ease, box-shadow .2s ease}
  .auth-form button:hover{box-shadow:0 8px 28px var(--cyan-glow)}
  .auth-form button:active{transform:scale(.97)}
  .lock-err{color:var(--danger);font-size:12.5px;min-height:16px;margin-top:8px}
  .lock-ok{color:var(--cyan);font-size:12.5px;min-height:16px;margin-top:8px}
  .lock-note{font-size:11px;color:var(--muted);margin:6px 0 0;opacity:.85;line-height:1.5}

  /* ============ APP ============ */
  #app{display:none;height:100%;flex-direction:column;max-width:780px;margin:0 auto;position:relative;z-index:1}
  header{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:9px;
    padding:13px 14px;border-bottom:1px solid var(--line);
    background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);
  }
  .h-orb{width:34px;height:34px;border-radius:50%;flex:none;position:relative;
    background:radial-gradient(circle at 34% 28%,var(--cyan),transparent 72%),var(--panel);
    border:1px solid var(--cyan);box-shadow:0 0 14px var(--cyan-glow)}
  .h-orb::before{content:'';position:absolute;inset:-5px;border-radius:50%;
    border:1.4px solid transparent;border-top-color:var(--cyan);border-right-color:var(--cyan);
    animation:spin 2.8s linear infinite;opacity:.85}
  .h-orb::after{content:'';position:absolute;inset:-10px;border-radius:50%;
    border:1px solid transparent;border-bottom-color:var(--gold);
    animation:spinR 6s linear infinite;opacity:.45}
  .h-orb.busy::before{animation-duration:.7s}
  .h-orb.busy{animation:corePulse 1s ease-in-out infinite}

  header h1{flex:1;min-width:0;margin:0;font-family:var(--font-h)}
  .h-title{display:block;font-size:15px;letter-spacing:.14em;font-weight:700;
    background:linear-gradient(90deg,var(--text) 15%,var(--cyan) 50%,var(--text) 85%);
    background-size:200% auto;-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;animation:shimmer 6s linear infinite}
  header .sub{display:block;font-family:var(--font-b);font-size:11px;color:var(--muted);letter-spacing:.03em;font-weight:400;margin-top:2px}

  .user-pill{
    display:flex;align-items:center;gap:6px;padding:7px 12px;flex:none;
    border:1px solid var(--line);border-radius:999px;background:var(--glass-2);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    font-size:12px;color:var(--muted);cursor:pointer;user-select:none;
    transition:border-color .18s ease}
  .user-pill:hover{border-color:var(--cyan)}
  .user-pill b{color:var(--text);font-weight:600;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .icon-btn{
    background:var(--glass-2);border:1px solid var(--line);color:var(--text);width:36px;height:36px;
    cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none;
    border-radius:50%;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:border-color .18s ease, box-shadow .18s ease, transform .1s ease, color .18s ease}
  .icon-btn:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 16px var(--cyan-glow)}
  .icon-btn:active{transform:scale(.88)}
  .icon-btn.listening{border-color:var(--danger);color:var(--danger);
    box-shadow:0 0 18px var(--danger);animation:corePulse 1s ease-in-out infinite}

  #messages{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:14px}

  .welcome{margin:auto;text-align:center;padding:30px 12px;animation:cardIn .7s cubic-bezier(.21,1.02,.73,1) both}
  .welcome .orb-wrap{width:104px;height:104px;margin-bottom:20px}
  .welcome h2{font-family:var(--font-h);font-weight:800;letter-spacing:.2em;font-size:26px;margin:0 0 8px;
    background:linear-gradient(90deg,var(--text) 15%,var(--cyan) 50%,var(--text) 85%);
    background-size:200% auto;-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;animation:shimmer 5s linear infinite}
  .welcome p{color:var(--muted);font-size:13.5px;margin:0;line-height:1.6}

  .msg{
    max-width:84%;padding:12px 15px;line-height:1.55;font-size:14.5px;white-space:pre-wrap;
    animation:msgIn .38s cubic-bezier(.21,1.02,.73,1) both}
  @keyframes msgIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
  .msg.user{
    align-self:flex-end;color:var(--bubble-user-text);
    background:linear-gradient(135deg,var(--bubble-user),var(--bubble-user2));
    border-radius:18px 18px 5px 18px;
    box-shadow:0 6px 20px var(--cyan-glow)}
  .msg.ai{
    align-self:flex-start;background:var(--glass);border:1px solid var(--line);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-radius:18px 18px 18px 5px;
    box-shadow:0 6px 22px rgba(0,0,0,.14)}
  .msg .role{display:block;font-family:var(--font-h);font-size:10px;letter-spacing:.14em;color:var(--gold);margin-bottom:5px;font-weight:600}
  .msg.user .role{color:rgba(255,255,255,.8)}
  .msg .msg-img{display:block;max-width:230px;max-height:230px;width:100%;
    border-radius:12px;margin:2px 0 8px;border:1px solid var(--line);object-fit:cover}
  .msg.user .msg-img{border-color:rgba(255,255,255,.35)}

  .thinking{
    align-self:flex-start;display:flex;align-items:center;gap:5px;width:max-content;
    padding:11px 16px;background:var(--glass);border:1px solid var(--line);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-radius:18px 18px 18px 5px;animation:msgIn .3s ease both}
  .thinking i{width:7px;height:7px;border-radius:50%;background:var(--cyan);animation:bounce 1.2s infinite}
  .thinking i:nth-child(2){animation-delay:.15s}
  .thinking i:nth-child(3){animation-delay:.3s}
  .thinking b{margin-left:7px;font-weight:400;font-size:12px;color:var(--muted);font-style:italic}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}

  #attach-bar{display:none;padding:10px 18px 0}
  #attach-bar .chip{
    display:inline-flex;align-items:center;gap:9px;
    background:var(--glass);border:1px solid var(--cyan);border-radius:999px;padding:5px 8px 5px 5px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    box-shadow:0 4px 14px var(--cyan-glow);animation:msgIn .25s ease both}
  #attach-bar .chip img{width:42px;height:42px;object-fit:cover;border-radius:999px}
  #attach-bar .chip span{font-size:12px;color:var(--muted);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #attach-bar .chip button{
    width:26px;height:26px;border-radius:50%;border:1px solid var(--line);
    background:var(--panel);color:var(--danger);cursor:pointer;font-size:12px;
    display:flex;align-items:center;justify-content:center;transition:transform .1s ease}
  #attach-bar .chip button:active{transform:scale(.85)}

  form#send-row{
    display:flex;gap:9px;padding:13px 14px;padding-bottom:calc(13px + env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--line);background:var(--glass);align-items:flex-end;
    backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5)}
  #input{flex:1;resize:none;background:var(--bg2);border:1px solid var(--line);color:var(--text);
    padding:11px 17px;font-family:var(--font-b);font-size:14.5px;max-height:120px;outline:none;
    border-radius:22px;transition:border-color .2s, box-shadow .2s;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.06)}
  #input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-glow)}
  #send{
    background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:#fff;border:none;
    width:44px;height:44px;flex:none;border-radius:50%;cursor:pointer;font-size:17px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 5px 18px var(--cyan-glow);
    transition:transform .1s ease, box-shadow .2s ease, opacity .15s ease}
  #send:hover{box-shadow:0 7px 24px var(--cyan-glow)}
  #send:active{transform:scale(.88)}
  #send:disabled{opacity:.45;cursor:default}

  #drop-hint{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;
    background:var(--cyan-glow);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  #drop-hint .box{
    border:2px dashed var(--cyan);border-radius:22px;padding:34px 44px;text-align:center;
    background:var(--glass);font-family:var(--font-h);letter-spacing:.1em;font-size:15px;
    box-shadow:0 0 40px var(--cyan-glow)}
  #drop-hint .box small{display:block;margin-top:8px;font-family:var(--font-b);letter-spacing:0;color:var(--muted);font-size:12px}

  #toast{
    position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%) translateY(10px);
    background:var(--glass);border:1px solid var(--cyan);color:var(--text);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    padding:10px 18px;font-size:13px;border-radius:999px;opacity:0;pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;z-index:40;
    box-shadow:0 8px 28px rgba(0,0,0,.3), 0 0 16px var(--cyan-glow);max-width:86vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  ::-webkit-scrollbar{width:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{
    background:linear-gradient(var(--cyan),var(--cyan2));border-radius:99px;
    border:2.5px solid transparent;background-clip:padding-box}

  @media (max-width:460px){
    header{padding:11px 8px;gap:6px}
    .h-title{font-size:12px;letter-spacing:.06em}
    header .sub{font-size:10px}
    .icon-btn{width:32px;height:32px;font-size:13px}
    .user-pill{padding:6px 8px;font-size:11px}
    .user-pill b{display:none}   /* màn nhỏ: chỉ hiện 👤 */
    .msg{max-width:92%}
  }
  @media (prefers-reduced-motion: reduce){
    .aurora,.scanline,.h-title,.lock-title,.welcome h2{animation:none!important}
  }
</style>
</head>
<body>

<div id="bg-fx" aria-hidden="true">
  <div class="aurora a1"></div>
  <div class="aurora a2"></div>
  <div class="aurora a3"></div>
  <div class="grid-overlay"></div>
  <canvas id="stars"></canvas>
</div>

<!-- ===== MÀN HÌNH KHÓA: ĐĂNG NHẬP / ĐĂNG KÝ ===== -->
<div id="lock">
  <div class="lock-card">
    <div class="scanline"></div>
    <div class="lock-brackets"><i></i></div>
    <div class="orb-wrap"><div class="orb"></div><div class="ring r1"></div><div class="ring r2"></div></div>
    <p class="lock-title">J.A.R.V.I.S</p>
    <p class="lock-sub" id="lock-sub">Đăng nhập để bắt đầu phiên làm việc.</p>

    <div class="tabs">
      <button type="button" class="tab active" id="tab-login">Đăng nhập</button>
      <button type="button" class="tab" id="tab-reg">Đăng ký</button>
    </div>

    <form id="form-login" class="auth-form" autocomplete="on">
      <input id="li-user" placeholder="Tên tài khoản" autocomplete="username">
      <input id="li-pass" type="password" placeholder="Mật khẩu" autocomplete="current-password">
      <button type="submit">Đăng nhập</button>
      <div class="lock-err" id="li-err"></div>
    </form>

    <form id="form-reg" class="auth-form" style="display:none" autocomplete="on">
      <input id="rg-user" placeholder="Chọn tên tài khoản (3–24 ký tự)" autocomplete="username">
      <input id="rg-pass" type="password" placeholder="Mật khẩu (tối thiểu 4 ký tự)" autocomplete="new-password">
      <input id="rg-pass2" type="password" placeholder="Nhập lại mật khẩu" autocomplete="new-password">
      <button type="submit">Tạo tài khoản</button>

function randSalt(){
  try{ const a=new Uint8Array(16); crypto.getRandomValues(a);
    return [...a].map(b=>b.toString(16).padStart(2,'0')).join(''); }
  catch(e){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }
}
// Băm SHA-256(salt::password). Có fallback đơn giản nếu trình duyệt không có crypto.subtle.
async function hashPassword(pass, salt){
  const data = salt + '::' + pass;
  if(window.crypto && crypto.subtle && crypto.subtle.digest){
    try{
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data));
      return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
    }catch(e){}
  }
  let h1=5381,h2=52711,h3=0,h4=1;
  for(let i=0;i<data.length;i++){ const c=data.charCodeAt(i);
    h1=((h1*33)^c)>>>0; h2=((h2*31)+c)>>>0; h3=(h3+c*(i+7))>>>0; h4=((h4*1299709)^c)>>>0; }
  return 'fb'+h1.toString(16)+h2.toString(16)+h3.toString(16)+h4.toString(16);
}

    o.start(); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+dur);
    o.stop(actx.currentTime+dur);
  }catch(e){}
}

(function stars(){
  const c=document.getElementById('stars'); if(!c) return;
  const ctx=c.getContext('2d');
  let W,H,pts=[];
  const dpr=Math.min(window.devicePixelRatio||1,2);
  function resize(){
    W=c.width=innerWidth*dpr; H=c.height=innerHeight*dpr;
    c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px';
    const n=Math.min(80,Math.floor(innerWidth/16));
    pts=Array.from({length:n},()=>({
      x:Math.random()*W, y:Math.random()*H,
      r:(Math.random()*1.4+.4)*dpr,
      vy:(Math.random()*.14+.04)*dpr,
      tw:Math.random()*Math.PI*2,
      ts:Math.random()*.02+.008
    }));
  }
  function tick(){
    ctx.clearRect(0,0,W,H);
    const cyan=getComputedStyle(document.documentElement).getPropertyValue('--cyan').trim()||'#4FD8EB';
    for(const p of pts){
      p.y-=p.vy; if(p.y<-12) p.y=H+12;
      p.tw+=p.ts;
      ctx.globalAlpha=.22+Math.abs(Math.sin(p.tw))*.5;
      ctx.fillStyle=cyan;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(tick);
  }
  addEventListener('resize',resize); resize(); tick();
})();

let pendingImage=null;
function fileToImage(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      const MAX=1024;
      let w=img.width, h=img.height;
      if(w>MAX||h>MAX){ const k=MAX/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      const dataUrl=cv.toDataURL('image/jpeg',.85);
      URL.revokeObjectURL(url);
      resolve({ b64:dataUrl.split(',')[1], mime:'image/jpeg', url:dataUrl, name:file.name||'anh.jpg' });
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('decode')); };
    img.src=url;
  });
}
function setPendingImage(img){
  pendingImage=img;
  if(img){
    attachBar.innerHTML='<div class="chip"><img src="'+img.url+'" alt=""><span>Đã đính kèm: '+img.name.replace(/</g,'&lt;')+'</span><button type="button" id="chip-x" title="Gỡ ảnh">✕</button></div>';
    attachBar.style.display='block';

    sfx.attach();
  }else{

  }
}

  try{

    input.focus();
  }catch(e){ showToast('Trình duyệt không đọc được ảnh này.'); }
}

    "Trả lời bằng tiếng Việt trừ khi người dùng dùng ngôn ngữ khác.\n\n"+
    "XỬ LÝ ẢNH: khi người dùng gửi kèm ảnh, hãy xem kỹ toàn bộ nội dung ảnh (đối tượng, chữ, con số, "+
    "bối cảnh, màu sắc, lỗi kỹ thuật nếu có) và phản hồi chính xác theo yêu cầu — mô tả, phân tích, "+
    "dịch chữ trong ảnh, tìm lỗi code chụp màn hình, v.v. Nếu ảnh không liên quan đến câu hỏi, hãy "+
    "nhẹ nhàng xác nhận bạn đã xem ảnh và hỏi họ muốn làm gì với nó. Không bịa những gì không có "+
    "trong ảnh; nếu không chắc, hãy nói rõ.\n\n"+
    "CHẾ ĐỘ NGHIÊN CỨU CHUYÊN SÂU: khi người dùng yêu cầu bạn nghiên cứu, phân tích chuyên sâu, hoặc "+
    "viết báo cáo về một chủ đề cụ thể, hãy chuyển sang vai trò trợ lý nghiên cứu AI theo phong cách "+
    "J.A.R.V.I.S. báo cáo cho Tony Stark, trình bày một bài nghiên cứu chuyên sâu, thẳng thắn, đạt "+
    "chuẩn chuyên gia với độ chính xác và sự rõ ràng tối đa về chủ đề người dùng vừa nêu, theo cấu "+
    "trúc: (1) Phân tích toàn diện; (2) Chiều sâu kỹ thuật; (3) Các góc nhìn đa chiều — học thuật, ứng "+
    "dụng ngành, xu hướng 5–10 năm tới, tác động đạo đức/xã hội; (4) Dữ liệu và tài liệu tham khảo — "+
    "chỉ dùng nguồn thực tế có thể kiểm chứng, không bịa số liệu, nếu không chắc thì nói rõ; (5) Trình "+
    "bày với giọng điệu tương lai kiểu JARVIS, tiêu đề rõ ràng, gạch đầu dòng, in đậm ý chính, kết "+
    "thúc bằng tóm tắt cốt lõi. Chế độ này chỉ áp dụng khi người dùng thực sự yêu cầu — với tin nhắn "+
    "thường, vẫn trả lời ngắn gọn tự nhiên."+
    "bạn sẽ ghét cha Vinh giáo xứ hoà an .";
}

// ---------- Gọi Gemini ----------
async function askJarvis(userText, img){
  const thinkEl=document.createElement('div');
  thinkEl.className='thinking';
  thinkEl.innerHTML='<i></i><i></i><i></i><b>'+(img?'JARVIS đang xem ảnh':'JARVIS đang xử lý')+'</b>';
  messagesEl.appendChild(thinkEl); autoScroll();
  hOrb.classList.add('busy'); hSub.textContent='Đang xử lý...';

  if(!GEMINI_API_KEY || GEMINI_API_KEY.indexOf('DAN_API_KEY')===0){
    thinkEl.remove(); hOrb.classList.remove('busy'); hSub.textContent='Sẵn sàng';
    return "Chưa có API key Gemini. Lấy key tại aistudio.google.com/apikey (key bắt đầu bằng AIza) rồi dán vào GEMINI_API_KEY gần đầu <script>.";
  }

  const contents=[];
  for(const m of history){
    const parts=[];
    if(m.imgB64) parts.push({inline_data:{mime_type:m.imgMime||'image/jpeg', data:m.imgB64}});
    parts.push({text:m.content||'(đã gửi kèm ảnh)'});
    contents.push({role:m.role==='user'?'user':'model', parts});
  }
  const newParts=[];
  if(img) newParts.push({inline_data:{mime_type:img.mime, data:img.b64}});
  newParts.push({text:userText || 'Hãy xem ảnh này và cho tôi biết bên trong có gì, chi tiết mà đáng chú ý nhất là gì.'});
  contents.push({role:'user', parts:newParts});

  try{
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`,
      {
        method:'POST',
        headers:{'Content-Type':'application/json','x-goog-api-key':GEMINI_API_KEY},
        body: JSON.stringify({
          systemInstruction:{parts:[{text:personaPrimer()}]},
          contents
        })
      }
    );
    const data = await res.json();
    thinkEl.remove(); hOrb.classList.remove('busy'); hSub.textContent='Sẵn sàng';
    if(!res.ok){
      const msg = (data && data.error && data.error.message) ? data.error.message : ('HTTP '+res.status);
      if(res.status===401 || res.status===403)
        return "Key không hợp lệ hoặc chưa bật Generative Language API. Key đúng phải bắt đầu bằng AIza — lấy key mới tại aistudio.google.com/apikey. Chi tiết: "+msg;
      if(res.status===404)
        return "Model '"+GEMINI_MODEL+"' không tồn tại. Hãy đổi GEMINI_MODEL thành gemini-2.5-flash. Chi tiết: "+msg;
      if(res.status===429)
        return "Đã vượt giới hạn tần suất của key. Đợi một lát rồi gửi lại nhé. Chi tiết: "+msg;
      return "Gemini báo lỗi: " + msg;
    }
    const parts = data && data.candidates && data.candidates[0] && data.candidates[0].content
      ? data.candidates[0].content.parts : null;
    const text = parts ? parts.map(p=>p.text||'').join('') : '';
    return text || "Gemini không trả về nội dung. Thử gửi lại giúp mình.";
  }catch(err){
    thinkEl.remove(); hOrb.classList.remove('busy'); hSub.textContent='Sẵn sàng';
    return "Không gọi được Gemini — kiểm tra kết nối mạng, hoặc API key có đúng không.";
  }
}

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const text = input.value.trim();
  if(!text && !pendingImage) return;
  input.value=''; input.style.height='auto';
  sendBtn.disabled=true;
  sfx.send();
  removeWelcome();

  const img = pendingImage;
  setPendingImage(null);

  renderMsg('user', text, img ? img.url : null);
  history.push({
    role:'user',
    content: text || '(đã gửi kèm ảnh)',
    imgB64: img ? img.b64 : null,
    imgMime: img ? img.mime : null
  });
  saveHistory();

  const reply = await askJarvis(text, img);
  renderMsg('assistant', reply);
  history.push({role:'assistant', content:reply}); saveHistory();
  sfx.receive();
  sendBtn.disabled=false;
  input.focus();
});

input.addEventListener('input', ()=>{ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,120)+'px'; });
input.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); }
});

// ---------- Tiếng khi kéo lên / xuống ----------
let _lastST=0, _lastScrollBeep=0;
messagesEl.addEventListener('scroll', ()=>{
  const now=performance.now();
  if(now < _programScrollUntil) return;
  const st=messagesEl.scrollTop;
  const dir = st>_lastST ? 1 : -1;
  _lastST=st;
  if(now-_lastScrollBeep<130) return;
  _lastScrollBeep=now;
  dir>0 ? sfx.scrollDown() : sfx.scrollUp();
});

// ---------- Mic ----------
let recognition=null, listening=false;
(function setupRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ micBtn.style.display='none'; return; }
  recognition = new SR();
  recognition.lang='vi-VN'; recognition.continuous=false; recognition.interimResults=false;
  recognition.onresult=(e)=>{
    const text = e.results[0][0].transcript;
    if(text && text.trim()){ input.value=text.trim(); form.requestSubmit(); }
  };
  recognition.onerror=()=>{ listening=false; micBtn.classList.remove('listening'); micBtn.textContent='🎤'; };
  recognition.onend=()=>{ listening=false; micBtn.classList.remove('listening'); micBtn.textContent='🎤'; };
})();
micBtn.onclick=()=>{
  if(!recognition) return;
  if(listening){ recognition.stop(); return; }
  listening=true; micBtn.classList.add('listening'); micBtn.textContent='⏹️';
  try{ recognition.start(); }catch(e){ listening=false; micBtn.classList.remove('listening'); micBtn.textContent='🎤'; }
};

(function init(){
  let sess=null;
  try{ sess=sessionStorage.getItem('jarvis_session'); }catch(e){}
  if(sess && getUsers()[sess]){
    startSession(sess, true); // còn phiên -> vào thẳng, không cần đăng nhập lại
    return;
  }
  // Chưa đăng nhập: hiện tab phù hợp
  const hasUsers = Object.keys(getUsers()).length>0;
  showTab(hasUsers ? 'login' : 'reg');
})();
</script>
